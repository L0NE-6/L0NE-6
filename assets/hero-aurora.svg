    <circle cx="352" cy="128" r="1.1"><animate attributeName="opacity" values="1;0.15;1" dur="5s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="446" cy="58" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="112" r="1.3"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="614" cy="46" r="1.7"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="122" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.9s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="772" cy="60" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="112" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="176" r="1.3"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="5.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="946" cy="196" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.7s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="248" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="866" cy="292" r="1.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.3s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="836" cy="84" r="96" fill="url(#moonhalo)"/>
  <circle cx="836" cy="84" r="29" fill="#FFF7ED" opacity="0.95"/>
  <circle cx="847" cy="76" r="4.5" fill="#FDE68A" opacity="0.45"/>
  <circle cx="827" cy="94" r="3.5" fill="#FDE68A" opacity="0.35"/>

  <g filter="url(#soft)">
    <path d="M-140 206 C 110 148, 320 252, 520 194 C 720 136, 880 226, 1140 166 L1140 268 C 880 328, 720 238, 520 296 C 320 354, 110 250, -140 308 Z" fill="url(#aur1)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 44 -16; 0 0" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-140 268 C 150 218, 340 316, 560 256 C 780 196, 900 286, 1140 236 L1140 330 C 900 380, 780 290, 560 350 C 340 410, 150 312, -140 362 Z" fill="url(#aur2)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -54 14; 0 0" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <ellipse cx="500" cy="150" rx="330" ry="86" fill="url(#titleglow)"/>

  <text x="500" y="152" text-anchor="middle" font-size="62" font-weight="700" fill="url(#title)" letter-spacing="14" filter="url(#glow2)">
    单走一个6
    <animate attributeName="opacity" values="0.9;1;0.9" dur="6.5s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="192" text-anchor="middle" font-size="14" fill="#E9D5FF" opacity="0.85" letter-spacing="6">一个人，一条路，也可以走得很美</text>
  <text x="500" y="220" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#A99BD6" opacity="0.9" letter-spacing="4">L0NE-6 &#183; SOLO BUT WARM</text>

  <g>
