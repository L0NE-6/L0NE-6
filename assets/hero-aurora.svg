      <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.12;0.78;1" dur="16.5s" begin="12.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;-290" dur="9.5s" repeatCount="indefinite"/><path d="M0 0 C 6 -7 14 -5 14 3 C 14 11 6 13 0 7 C -3 5 -3 2 0 0 Z" fill="#E9D5FF" transform="scale(0.8)"/></g>
    </g>
