      <g><animateTransform attributeName="transform" type="rotate" values="0;280" dur="9s" repeatCount="indefinite"/><path d="M0 0 C 6 -7 14 -5 14 3 C 14 11 6 13 0 7 C -3 5 -3 2 0 0 Z" fill="#E9D5FF" transform="scale(0.85)"/></g>
    </g>
