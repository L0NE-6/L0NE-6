      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.12;0.78;1" dur="18s" begin="7.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;-340" dur="11s" repeatCount="indefinite"/><path d="M0 0 C 6 -7 14 -5 14 3 C 14 11 6 13 0 7 C -3 5 -3 2 0 0 Z" fill="#FBCFE8" transform="scale(0.7)"/></g>
    </g>
    <g opacity="0">
