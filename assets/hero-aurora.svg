<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120e26"/>
      <stop offset="55%" stop-color="#1b1538"/>
      <stop offset="100%" stop-color="#2b2049"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F9A8D4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0"/>
      <stop offset="40%" stop-color="#A7F3D0" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#BAE6FD" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE1F0"/>
      <stop offset="48%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C7EBFF"/>
    </linearGradient>
    <radialGradient id="moonhalo">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FDE68A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titleglow">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E9D5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="400" fill="url(#sky)"/>

  <g fill="#FFF7ED">
    <circle cx="88" cy="62" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
