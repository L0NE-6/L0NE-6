  <g stroke="#8A2E00" stroke-width="3">
    <line x1="0" y1="360" x2="1000" y2="360"/>
    <line x1="0" y1="390" x2="1000" y2="390"/>
    <line x1="0" y1="420" x2="1000" y2="420"/>
    <line x1="40" y1="360" x2="40" y2="390"/><line x1="120" y1="360" x2="120" y2="390"/><line x1="200" y1="360" x2="200" y2="390"/><line x1="280" y1="360" x2="280" y2="390"/><line x1="360" y1="360" x2="360" y2="390"/><line x1="440" y1="360" x2="440" y2="390"/><line x1="520" y1="360" x2="520" y2="390"/><line x1="600" y1="360" x2="600" y2="390"/><line x1="680" y1="360" x2="680" y2="390"/><line x1="760" y1="360" x2="760" y2="390"/><line x1="840" y1="360" x2="840" y2="390"/><line x1="920" y1="360" x2="920" y2="390"/>
    <line x1="0" y1="390" x2="0" y2="420"/><line x1="80" y1="390" x2="80" y2="420"/><line x1="160" y1="390" x2="160" y2="420"/><line x1="240" y1="390" x2="240" y2="420"/><line x1="320" y1="390" x2="320" y2="420"/><line x1="400" y1="390" x2="400" y2="420"/><line x1="480" y1="390" x2="480" y2="420"/><line x1="560" y1="390" x2="560" y2="420"/><line x1="640" y1="390" x2="640" y2="420"/><line x1="720" y1="390" x2="720" y2="420"/><line x1="800" y1="390" x2="800" y2="420"/><line x1="880" y1="390" x2="880" y2="420"/><line x1="960" y1="390" x2="960" y2="420"/>
  </g>

  <!-- question blocks -->
  <g filter="url(#mShadow)">
    <g transform="translate(352,244)">
      <rect width="52" height="52" fill="#8A4B00"/><rect x="3" y="3" width="46" height="46" fill="#FFA044"/>
      <rect x="6" y="6" width="40" height="40" fill="#F8B800"/>
      <text x="26" y="37" text-anchor="middle" font-size="30" font-weight="900" fill="#FFFFFF">?</text>
      <rect x="7" y="7" width="4" height="4" fill="#FFF3C4"/><rect x="41" y="7" width="4" height="4" fill="#FFF3C4"/><rect x="7" y="41" width="4" height="4" fill="#FFF3C4"/><rect x="41" y="41" width="4" height="4" fill="#FFF3C4"/>
      <animate attributeName="opacity" values="1;0.88;1" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(428,244)">
      <rect width="52" height="52" fill="#8A4B00"/><rect x="3" y="3" width="46" height="46" fill="#FFA044"/>
      <rect x="6" y="6" width="40" height="40" fill="#F8B800"/>
      <text x="26" y="37" text-anchor="middle" font-size="30" font-weight="900" fill="#FFFFFF">?</text>
      <rect x="7" y="7" width="4" height="4" fill="#FFF3C4"/><rect x="41" y="7" width="4" height="4" fill="#FFF3C4"/><rect x="7" y="41" width="4" height="4" fill="#FFF3C4"/><rect x="41" y="41" width="4" height="4" fill="#FFF3C4"/>
      <animate attributeName="opacity" values="0.88;1;0.88" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(352,182)">
      <rect width="52" height="52" fill="#8A4B00"/><rect x="3" y="3" width="46" height="46" fill="#B36B00"/>
      <rect x="6" y="6" width="40" height="40" fill="#C97B00"/>
      <rect x="6" y="22" width="40" height="4" fill="#8A4B00"/><rect x="22" y="6" width="4" height="40" fill="#8A4B00"/>
      <rect x="9" y="9" width="4" height="4" fill="#E8A030"/><rect x="39" y="9" width="4" height="4" fill="#E8A030"/>
    </g>
  </g>

  <!-- coins -->
  <g>
    <g transform="translate(470,262)">
      <ellipse cx="0" cy="0" rx="13" ry="17" fill="#FFD93B" stroke="#C99A00" stroke-width="3">
        <animate attributeName="rx" values="13;2.5;13" dur="2.2s" repeatCount="indefinite"/>
