<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C94FC"/>
      <stop offset="100%" stop-color="#8FC0FF"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1a3a8a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#mSky)"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.98">
    <g transform="translate(70,58)"><rect x="0" y="18" width="96" height="26"/><rect x="18" y="4" width="58" height="20"/><rect x="32" y="-6" width="30" height="14"/></g>
    <g transform="translate(430,36)"><rect x="0" y="16" width="78" height="22"/><rect x="14" y="4" width="48" height="16"/><rect x="26" y="-4" width="24" height="12"/></g>
    <g transform="translate(830,72)"><rect x="0" y="18" width="90" height="24"/><rect x="16" y="5" width="54" height="18"/><rect x="30" y="-5" width="28" height="13"/></g>
  </g>

  <!-- hills -->
  <g>
    <path d="M40 360 L40 320 L64 320 L64 300 L96 300 L96 280 L128 280 L128 300 L160 300 L160 320 L184 320 L184 360 Z" fill="#00A800"/>
    <path d="M84 360 L84 336 L104 336 L104 320 L128 320 L128 336 L148 336 L148 360 Z" fill="#58D854"/>
    <path d="M700 360 L700 330 L724 330 L724 312 L756 312 L756 330 L780 330 L780 360 Z" fill="#00A800"/>
    <path d="M736 360 L736 342 L756 342 L756 330 L776 330 L776 360 Z" fill="#58D854"/>
