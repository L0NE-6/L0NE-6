    <animateTransform attributeName="transform" type="translate" values="190,336;238,336;190,336" dur="5s" repeatCount="indefinite"/>
    <path d="M0 26 L0 14 L6 14 L6 6 L14 6 L14 0 L34 0 L34 6 L42 6 L42 14 L48 14 L48 26 Z" fill="#9C5A1E"/>
    <path d="M8 26 L8 16 L16 16 L16 26 Z" fill="#F8D8B0"/>
    <path d="M32 26 L32 16 L40 16 L40 26 Z" fill="#F8D8B0"/>
    <rect x="10" y="10" width="10" height="8" fill="#FFFFFF"/><rect x="28" y="10" width="10" height="8" fill="#FFFFFF"/>
    <rect x="14" y="12" width="4" height="6" fill="#2A2A2A"/><rect x="30" y="12" width="4" height="6" fill="#2A2A2A"/>
    <rect x="8" y="26" width="14" height="8" fill="#5B3A1E"/><rect x="26" y="26" width="14" height="8" fill="#5B3A1E"/>
  </g>

  <!-- mario -->
  <g transform="translate(556,278) scale(5.4)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.1;0 0" dur="1.4s" repeatCount="indefinite"/>
      <rect x="3.6" y="0" width="10.4" height="3" fill="#E52521"/>
      <rect x="2.6" y="2" width="12.4" height="2" fill="#E52521"/>
      <rect x="3.6" y="4" width="10.4" height="5.6" fill="#FFC49B"/>
      <rect x="4.6" y="5.6" width="1.7" height="2.3" fill="#2A2A2A"/>
      <rect x="11" y="5.6" width="1.7" height="2.3" fill="#2A2A2A"/>
      <rect x="4.6" y="8.6" width="8.6" height="1.5" fill="#5B3A1E"/>
      <rect x="2.6" y="9.6" width="12.4" height="5.2" fill="#E52521"/>
      <rect x="3.9" y="10.1" width="9.8" height="4.7" fill="#2A5BD7"/>
      <rect x="5.4" y="11.2" width="1.7" height="1.7" fill="#FFD93B"/>
      <rect x="10.4" y="11.2" width="1.7" height="1.7" fill="#FFD93B"/>
      <rect x="0.4" y="10" width="2.3" height="4.6" fill="#E52521"/>
      <rect x="14.9" y="10" width="2.3" height="4.6" fill="#E52521"/>
      <rect x="0.4" y="13.6" width="2.3" height="2.2" fill="#FFC49B"/>
      <rect x="14.9" y="13.6" width="2.3" height="2.2" fill="#FFC49B"/>
      <rect x="3.4" y="14.8" width="4.6" height="3.1" fill="#2A5BD7"/>
      <rect x="9.5" y="14.8" width="4.6" height="3.1" fill="#2A5BD7"/>
      <rect x="2" y="17.3" width="6.2" height="1.9" fill="#5B3A1E"/>
      <rect x="9.2" y="17.3" width="6.2" height="1.9" fill="#5B3A1E"/>
