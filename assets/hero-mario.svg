    <rect x="812" y="288" width="120" height="72" fill="#00A800"/>
    <rect x="826" y="288" width="22" height="72" fill="#58D854"/>
    <rect x="800" y="270" width="144" height="30" fill="#00A800"/>
    <rect x="814" y="270" width="24" height="30" fill="#58D854"/>
