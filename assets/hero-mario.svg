  <!-- hud -->
  <g font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#FFFFFF">
    <text x="28" y="36">MARIO</text>
    <text x="28" y="58" fill="#FFD93B">&#9733; 000042</text>
    <text x="972" y="36" text-anchor="end">WORLD</text>
    <text x="972" y="58" text-anchor="end" fill="#FFD93B">1-1</text>
    <text x="500" y="36" text-anchor="middle" fill="#FFD93B">&#9679; x 06</text>
