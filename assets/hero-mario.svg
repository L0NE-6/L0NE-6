    <text x="500" y="128" text-anchor="middle" font-size="62" font-weight="900" fill="#FFFFFF" stroke="#E52521" stroke-width="10" paint-order="stroke" letter-spacing="8" filter="url(#mShadow)">单走一个6</text>
    <text x="500" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF" stroke="#2A5BD7" stroke-width="5" paint-order="stroke" letter-spacing="5" font-family="Consolas,Menlo,monospace">L0NE-6 &#183; WORLD 1-1</text>
